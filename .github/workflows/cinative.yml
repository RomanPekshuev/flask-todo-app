name: CI - Flask & SQLite (native Ubuntu)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.2"
  APP_PORT: "7345"
  FLASK_APP: "manage.py"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  ci:
    name: lint, init DB and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Initialize database
        run: |
          python manage.py db init || true
          python manage.py db migrate || true
          python manage.py db upgrade || true

      - name: Start Flask server
        run: |
          echo "Starting Flask server on port ${{ env.APP_PORT }}..."
          python manage.py runserver -h 0.0.0.0 -p ${{ env.APP_PORT }} > /tmp/flask.log 2>&1 &
          FLASK_PID=$!
          echo "Flask PID: $FLASK_PID"
          
          # Ждём, пока сервер поднимется (до 15 секунд)
          for i in {1..15}; do
            if curl -s http://localhost:${{ env.APP_PORT }}/ > /dev/null 2>&1; then
              echo "Server is ready after ${i} seconds"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 1
          done
          
          # Проверяем, что процесс ещё жив
          if ! kill -0 $FLASK_PID 2>/dev/null; then
            echo "Flask process died. Logs:"
            cat /tmp/flask.log
            exit 1
          fi

      - name: Smoke test Flask server
        run: |
          echo "Running smoke test..."
          curl --fail --retry 3 --retry-delay 2 --retry-all-errors \
            http://localhost:${{ env.APP_PORT }}/ \
            || (echo "Smoke test failed" && exit 1)
          echo "Smoke test passed — server responded on port ${{ env.APP_PORT }}"

      - name: Show Flask logs if failed
        if: failure()
        run: |
          echo "=== Flask Server Logs ==="
          cat /tmp/flask.log || echo "No logs found"

      - name: Stop Flask server
        if: always()
        run: |
          pkill -f "manage.py runserver" || true